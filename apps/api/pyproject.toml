[tool.poetry]
name = "trading-api"
version = "0.1.0"
description = "AI crypto trading / copy-trading platform API"
authors = ["Trading Platform"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
redis = "^5.1.0"
structlog = "^24.4.0"
python-dotenv = "^1.0.1"
prometheus-client = "^0.21.0"
httpx = "^0.27.2"
pandas = "^2.2.3"
numpy = "^2.1.3"
cryptography = "^43.0.0"
pyjwt = "^2.9.0"
argon2-cffi = "^23.1.0"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) as a default arg is the framework's documented pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
