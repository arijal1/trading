name: trading-platform

services:
  postgres:
    # Plain Postgres by default. The Phase 1 design named TimescaleDB for
    # OHLCV time-series, but nothing ever adopted it: there is not one
    # hypertable, time_bucket call, or timescale reference in the
    # application code or any migration. It was therefore a large image
    # pulled for no benefit — a real cost on a slow or metered link, and
    # on small hosts where postgres:16-alpine is often already cached.
    # Override to switch back if hypertables are genuinely adopted later:
    #   POSTGRES_IMAGE=timescale/timescaledb:latest-pg16
    # Do not switch an existing volume between the two: data written by
    # the timescaledb image will not start under plain Postgres, because
    # the extension it loads is absent. Use a fresh volume.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      # Host port is overridable: 5432 is very often already taken by a
      # locally-installed Postgres, and the collision makes `compose up`
      # fail in a way that looks like "the app won't start".
      # Set POSTGRES_PORT=5433 in .env if that happens.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    # Migrations run on start rather than in the image build: the database
    # only exists at run time, and without this a fresh `compose up` serves
    # an API whose every DB-backed endpoint 500s against empty schema.
    # `alembic upgrade head` is idempotent, so restarts are safe.
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
      args:
        # Baked in at build time: every dashboard fetch runs in the
        # browser, so this must be the URL *your browser* uses — not the
        # server's own address. On a headless host (a Raspberry Pi, a VPS)
        # "localhost" would resolve to the machine doing the browsing, so
        # set PUBLIC_HOST to the host's LAN IP or hostname:
        #   PUBLIC_HOST=192.168.1.50 docker compose ... up --build -d
        # Changing it requires a rebuild, not just a restart.
        NEXT_PUBLIC_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:${API_PORT:-8000}
        # Set by scripts/local.sh from the current commit, so the running
        # dashboard can say which build it is.
        BUILD_ID: ${BUILD_ID:-unknown}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    # Opt-in. Prometheus scrapes /metrics for dashboards; nothing in the
    # trading path depends on it, and the API serves /metrics with or
    # without it running. Keeping it out of the default set means one
    # fewer image to pull on a slow link, and less constant disk writing
    # on hosts (a Pi) where that matters. Start it explicitly with:
    #   bash scripts/up.sh --profile monitoring up -d
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

volumes:
  postgres_data:
